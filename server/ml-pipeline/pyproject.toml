[project]
name = "anomaly-ml-pipeline"
version = "0.1.0"
description = "Kafka publisher and training-data collector for the Anomaly model pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "esdbclient>=2.0,<3.0",
  "kafka-python>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0",
  "torch>=2.0",
  "torch-geometric>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<0.13",
]

[project.scripts]
anomaly-ml-pipeline = "app.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
