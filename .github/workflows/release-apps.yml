name: Release application installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match package.json, Cargo.toml and Tauri)'
        required: true
        default: '0.1.0'
      android_version_code:
        description: 'Android versionCode; defaults to repository variable ANDROID_VERSION_CODE'
        required: false

permissions:
  contents: read

concurrency:
  group: release-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-checks:
    uses: ./.github/workflows/ci-fe.yml
  backend-checks:
    uses: ./.github/workflows/ci-be.yml
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      android-code: ${{ steps.inputs.outputs.android-code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and release endpoint
        id: inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          ANDROID_CODE: ${{ inputs.android_version_code || vars.ANDROID_VERSION_CODE }}
          VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          export VERSION
          python3 scripts/release/apps.py --platform linux --check-only
          python3 - <<'PY'
          import os
          code = os.environ['ANDROID_CODE']
          if not code.isdecimal() or not 1 <= int(code) <= 2100000000:
              raise SystemExit('Set ANDROID_VERSION_CODE (or manual input) to a positive integer <= 2100000000')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={os.environ['VERSION']}\nandroid-code={int(code)}\n")
          PY
      - name: Test installer validation and collection
        run: python3 -m unittest discover -s scripts/release -p 'test_apps.py' -v

  desktop:
    needs: [prepare, frontend-checks, backend-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: client
        run: yarn install --frozen-lockfile --production=false
      - name: Build desktop installers
        run: python scripts/release/apps.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: dist/installers/${{ matrix.platform }}/
          if-no-files-found: error

  android:
    needs: [prepare, frontend-checks, backend-checks]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
      ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android-code }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          printf 'NDK_HOME=%s/ndk/29.0.14206865\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_NDK_HOME=%s/ndk/29.0.14206865\n' "$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anomaly-release.jks
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ['KEY_BASE64']
          if not key:
              raise SystemExit('Set ANDROID_KEYSTORE_BASE64 signing secret')
          path = Path(os.environ['ANDROID_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
          python3 scripts/release/apps.py --platform android --check-only
      - name: Enable Corepack
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: client
        run: yarn install --frozen-lockfile --production=false
      - name: Build and verify signed ARM64 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anomaly-release.jks
        run: python3 scripts/release/apps.py --platform android
      - name: Remove signing key
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/anomaly-release.jks
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['ANDROID_KEYSTORE_PATH']).unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: dist/installers/android/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Verify checksums and publish the built installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: installers
        run: |
          sha256sum --check SHA256SUMS-android.txt SHA256SUMS-linux.txt SHA256SUMS-windows.txt
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --draft ./*
          gh release edit "$RELEASE_TAG" --draft=false
