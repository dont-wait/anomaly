name: Release container images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Source release version (for example 0.1.0)'
        required: true
        default: '0.1.0'
      gatv2_ref:
        description: 'Committed GATv2 revision; defaults to repository variable GATV2_REF'
        required: false

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-checks:
    uses: ./.github/workflows/ci-fe.yml
  backend-checks:
    uses: ./.github/workflows/ci-be.yml
  publish:
    needs: [frontend-checks, backend-checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GATV2_REF: ${{ inputs.gatv2_ref || vars.GATV2_REF }}
      GATV2_DIR: ${{ github.workspace }}/GATv2
      RELEASE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: anomaly
          persist-credentials: false
      - name: Validate release inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        working-directory: anomaly
        run: |
          test -n "$GATV2_REF" || { echo 'Set GATV2_REF repository variable or workflow input'; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'REGISTRY=ghcr.io/%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GATV2_REPOSITORY || 'pdmh18/GATv2' }}
          ref: ${{ env.GATV2_REF }}
          token: ${{ secrets.GATV2_READ_TOKEN || github.token }}
          path: GATv2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test release orchestration
        working-directory: anomaly
        run: make release-test
      - name: Run the same local pipeline and push images
        working-directory: anomaly
        run: make release
      - name: Save build and pushed digest manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: anomaly/dist/release/
          if-no-files-found: warn
