name: CI - Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci-be.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci-be.yml"

permissions:
  contents: read

concurrency:
  group: ci-be-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          files="$($(go env GOPATH)/bin/gofumpt -l .)"
          if [ -n "$files" ]; then
            printf 'The following files need gofumpt:\n%s\n' "$files"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test ./...
