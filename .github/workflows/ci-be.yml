name: CI - Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "python-service/**"
      - ".github/workflows/ci-be.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "python-service/**"
      - ".github/workflows/ci-be.yml"

permissions:
  contents: read

concurrency:
  group: ci-be-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          files="$($(go env GOPATH)/bin/gofumpt -l .)"
          if [ -n "$files" ]; then
            printf 'The following files need gofumpt:\n%s\n' "$files"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: golangci-lint run

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test
        run: go test ./...

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: pytest

  python-openapi:
    name: python-openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Validate OpenAPI endpoint
        run: python -c "from fastapi.testclient import TestClient; from app.main import app; client = TestClient(app); response = client.get('/openapi.json'); response.raise_for_status(); print(response.json()['info']['title'])"
