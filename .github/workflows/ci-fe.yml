name: CI - Frontend

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/ci-fe.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/ci-fe.yml"

permissions:
  contents: read

concurrency:
  group: ci-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: client

      - name: Lint
        run: yarn workspace anomaly-${{ matrix.target }} lint
        working-directory: client

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: client

      - name: Typecheck
        run: yarn workspace anomaly-${{ matrix.target }} typecheck
        working-directory: client

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: client

      - name: Test
        run: yarn workspace anomaly-${{ matrix.target }} test
        working-directory: client
